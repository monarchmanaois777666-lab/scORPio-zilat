<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, DPR;
function resize(){ DPR = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

// ---- particles on a sphere (fibonacci) + nearest-neighbour links ----
const N = 650, P = [], L = [];
for (let i = 0; i < N; i++){
  const y = 1 - 2*(i+.5)/N, r = Math.sqrt(1-y*y), a = i*2.399963;
  P.push({x:r*Math.cos(a), y, z:r*Math.sin(a), ph:Math.random()*6.28, sp:.5+Math.random()});
}
for (let i = 0; i < N; i++){
  const d = [];
  for (let j = 0; j < N; j++) if (i!==j){ const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, dz=P[i].z-P[j].z; d.push([dx*dx+dy*dy+dz*dz, j]); }
  d.sort((a,b)=>a[0]-b[0]);
  for (let k = 0; k < 2; k++) if (i < d[k][1]) L.push([i, d[k][1]]);
}
for (let i = 0; i < 160; i++) L.push([Math.random()*N|0, Math.random()*N|0]); // chaotic long links

// ---- state machine: each state tunes the orb ----
const STATES = {
  idle:      {spin:.15, disp:.06, jit:.02, size:1.00, link:.18, hue:200, label:'idle'},
  listening: {spin:.30, disp:.20, jit:.10, size:1.10, link:.30, hue:185, label:'listening'},
  thinking:  {spin:1.60, disp:.12, jit:.05, size:.78, link:.55, hue:215, label:'thinking'},
  speaking:  {spin:.35, disp:.16, jit:.08, size:1.05, link:.40, hue:195, label:'speaking'}
};
let state = 'idle', cur = {...STATES.idle}, amp = 0, ampTarget = 0, rot = 0, t = 0, burst = 0;
function setState(s){ state = s; $('status').textContent = STATES[s].label; }

const proj = new Float32Array(N*4);
function frame(now){
  const dt = Math.min(.05, (now - (frame.last||now))/1000); frame.last = now; t += dt;
  const T = STATES[state];
  for (const k in T) if (typeof T[k]==='number') cur[k] += (T[k]-cur[k])*Math.min(1, dt*3);
  amp += (ampTarget-amp)*Math.min(1, dt*12); burst *= Math.pow(.02, dt);
  rot += dt*cur.spin;

  ctx.clearRect(0,0,W,H);
  const R = Math.min(W,H*.7)*.28*cur.size, cx = W/2, cy = H*.38;
  const cr = Math.cos(rot), sr = Math.sin(rot), tilt = .35, ct = Math.cos(tilt), st = Math.sin(tilt);
  for (let i = 0; i < N; i++){
    const p = P[i];
    const wob = Math.sin(t*p.sp*2 + p.ph + p.y*4)*cur.disp + Math.sin(t*3+p.ph)*amp*.25 + burst*Math.sin(p.ph*3)*.3;
    const rad = R*(1 + wob + (Math.random()-.5)*cur.jit);
    let x = p.x*rad, y = p.y*rad, z = p.z*rad;
    let x1 = x*cr + z*sr, z1 = -x*sr + z*cr;
    let y1 = y*ct - z1*st, z2 = y*st + z1*ct;
    const f = 600/(600 - z2);
    proj[i*4] = cx + x1*f; proj[i*4+1] = cy + y1*f; proj[i*4+2] = z2/R; proj[i*4+3] = f;
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1;
  for (const [a,b] of L){
    const za = proj[a*4+2], zb = proj[b*4+2];
    const al = cur.link*(.35 + .65*((za+zb)/4 + .5));
    ctx.strokeStyle = `hsla(${cur.hue},90%,70%,${Math.max(0,al)})`;
    ctx.beginPath(); ctx.moveTo(proj[a*4], proj[a*4+1]); ctx.lineTo(proj[b*4], proj[b*4+1]); ctx.stroke();
  }
  for (let i = 0; i < N; i++){
    const z = proj[i*4+2], s = (1.1 + z*.8 + amp*1.2)*proj[i*4+3]*.9;
    ctx.fillStyle = `hsla(${cur.hue},95%,${70+z*15}%,${.45+.4*(z*.5+.5)})`;
    ctx.fillRect(proj[i*4]-s/2, proj[i*4+1]-s/2, s, s);
  }
  // soft core glow
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.3);
  g.addColorStop(0, `hsla(${cur.hue},100%,60%,${.10+amp*.25+burst*.2})`); g.addColorStop(1,'transparent');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Jarvis "brain": simple local rules (swap ask() for an LLM call if you want) ----

  [/\b(who|what) are you\b|your name/, () => 'I am scORPio zilat, your Jarvis-style AI trading assistant.'],

  [/\b(\d+)\s*([+\-*x\/])\s*(\d+)\b/, m => { const a=+m[1], b=+m[3], o=m[2]; const r = o=='+'?a+b:o=='-'?a-b:o=='/'?a/b:a*b; return `That comes to ${+r.toFixed(4)}.`; }]
];
const FOREX_KB = [
  [/\bgold\b|xauusd|xau.?usd/, "Gold, XAUUSD, is priced in dollars per ounce. It moves in much bigger swings than a currency pair and the spread is wider, so I assume a higher cost and size the position by dollars per ounce. On MetaTrader 5 one standard lot is 100 ounces. I can scan and trade it when you ask, for example scan XAUUSD, and I backtest it like any other pair before proposing a trade. Gold is not in my default scan unless you set JARVIS_INCLUDE_GOLD to 1. Expect larger losses per move, so keep your risk low."],
  [/4 ?h(our)? range|four.?hour range|first 4 ?h(our)? candle|failed breakout/, "The four hour range strategy: on the four-hour chart, wait for the first New York candle of the day to close, and mark its high and low. Then on the five-minute chart, wait for a candle to close outside the range, and the very next candle to close back inside. If it broke above and came back, go short. If it broke below and came back, go long. Put the stop beyond the extreme of the failed breakout, and take profit at the opposite side of the range, or at one to two risk to reward. Ask me to scan after the first four-hour candle closes and I will test it before proposing a trade."],
  [/cr model|9 ?am|8 ?am (candle|high|low|range)|ifvg|inverse fair value/, "The nine A M C R model: mark the high and low of the eight A M one-hour candle in New York time. If the nine o'clock candle trades into the high, bias is short toward the low. If it trades into the low, bias is long toward the high. Then on the one-minute chart, wait for an inverse fair value gap and an order block while price taps that level, enter on confirmation, put the stop beyond the swing, and target the other side of the eight A M range."],
  [/multi.?time.?frame|higher time.?frame|top.?down/, "Top-down analysis: mark the trend and key levels on a higher timeframe like the daily or four-hour, refine your zone on the one-hour, then time entries on the fifteen-minute or five-minute. Only trade in the direction of the higher timeframe bias."],
  [/\bpips?\b|\blot size|\blots?\b|pip value/, "A pip is the fourth decimal place on most pairs, and the second on yen pairs. A standard lot is 100,000 units, worth about ten dollars per pip on dollar-quoted pairs, a mini lot is a tenth of that, and a micro lot a hundredth."],
  [/leverage|margin/, "Leverage lets you control a large position with small capital, for example one to fifty. Margin is the deposit your broker holds. High leverage magnifies losses as much as gains, so most professionals keep effective leverage low and risk a fixed percent per trade."],
  [/position siz|how much (to )?risk|risk management|risk per trade|money management/, "Risk one to two percent of your account per trade. Position size equals account risk in dollars divided by stop distance in pips times pip value. Aim for at least one to two reward-to-risk, and cap your daily loss so one bad day cannot wreck you."],
  [/risk.?reward|reward.?to.?risk|\brr\b|win rate/, "Expectancy equals win rate times average win minus loss rate times average loss. With one to two risk-reward you only need to win about thirty-four percent of trades to break even, before costs. Win rate alone means nothing without the reward-to-risk ratio."],
  [/stop.?loss|\bsl\b|take profit|trailing/, "Place your stop where your idea is proven wrong, such as beyond a swing high or low or a multiple of ATR, not at a random pip count. Take profit at the next structure level or a fixed multiple of risk, and trail stops behind swing points or the ATR once price moves in your favor."],
  [/support|resistance|supply.?(and)?.?demand|demand zone|supply zone/, "Support and resistance are price areas where buyers or sellers repeatedly stepped in. Treat them as zones, not exact lines. A level that breaks often flips role, so old resistance becomes new support. Supply and demand zones mark the origin of strong impulsive moves."],
  [/trend ?line|channel/, "Draw a trendline through at least two swing lows in an uptrend or two swing highs in a downtrend, and it gains weight with a third touch. A break with a retest often signals a change of trend, and parallel channels give you buy-the-dip and sell-the-rally zones."],
  [/candle|pin bar|engulf|doji|hammer|shooting star|price action|inside bar/, "Key price action signals: pin bars, which show rejection with a long wick, engulfing candles, which show momentum shifts, doji for indecision, and inside bars for compression before a breakout. They matter most at key levels, with the trend, and on higher timeframes."],
  [/golden cross|death cross|moving average|\bsma\b|\bema\b|\bma\b/, "Moving averages smooth price and define trend. The fifty and two-hundred averages are popular, a golden cross is the fifty crossing above the two hundred, and a death cross is the reverse. EMAs react faster than SMAs. They lag, so they work best in trends and badly in ranges."],
  [/\brsi\b|relative strength/, "RSI is a momentum oscillator from zero to one hundred, using fourteen periods by default. Above seventy is overbought and below thirty is oversold, but in strong trends it can stay extreme for a long time. Divergence between RSI and price is a more useful warning than the levels alone."],
  [/macd/, "MACD is the twelve-period EMA minus the twenty-six-period EMA, with a nine-period signal line and a histogram. A signal line cross or zero-line cross shows momentum shifts, and divergence against price warns of exhaustion. It lags, so use it with structure."],
  [/bollinger|bands/, "Bollinger Bands are a twenty-period average with bands two standard deviations away. A squeeze signals low volatility before expansion, and walking the band shows strong trend. In ranges, touches of the band can mean revert to the mean."],
  [/stochastic/, "The stochastic oscillator compares the close to the recent high-low range. Readings above eighty are overbought and below twenty are oversold. It works best in ranging markets, and crosses are stronger when they occur at key support or resistance."],
  [/\batr\b|average true range|volatility/, "ATR measures average price range over fourteen periods. Use it to set stops, for example one and a half to two times ATR from entry, to size positions, and to see whether the market is quiet or expanding."],
  [/fib|retracement|golden ratio|extension/, "Fibonacci retracements map likely pullback depths in a trend, most watched at thirty-eight, fifty and sixty-two percent, with the sixty-one point eight percent golden ratio. Extensions at one-twenty-seven and one-sixty-one are used for targets. They work best when they line up with other structure."],
  [/ichimoku|cloud|kumo/, "Ichimoku shows trend, momentum and support all at once. Price above the cloud is bullish and below is bearish, a thick cloud means strong support or resistance, and the Tenkan crossing the Kijun gives timing signals. The lagging span confirms the trend."],
  [/\badx\b|trend strength|directional/, "ADX measures trend strength, not direction. Below twenty usually means a range, above twenty-five suggests a trend. Use it to choose strategy: trend following when high, mean reversion when low."],
  [/pivot/, "Pivot points are calculated from the prior period's high, low and close, giving a central pivot with support and resistance levels. Intraday traders watch them as reaction zones, especially on the London and New York sessions."],

  [/break.?out|false break|fakeout|retest/, "Breakout trading enters when price closes beyond a key level on strong momentum or volume. Many breaks fail, so traders wait for a candle close and a retest of the broken level. A failed breakout that snaps back is itself a strong reversal signal."],
  [/trend.?follow|trend trading|with the trend|higher highs|market structure|\bbos\b|choch|break of structure/, "An uptrend is a series of higher highs and higher lows, and a downtrend is the opposite. Trend followers buy pullbacks to support, moving averages or Fibonacci levels. A break of structure confirms the trend continues, and a change of character warns it may reverse."],
  [/range|mean.?reversion|sideways|consolidat/, "In a range, buy near support and sell near resistance, with stops just outside the range. Oscillators like RSI and stochastic work better there. Always expect an eventual breakout, so reduce size near the edges."],
  [/scalp|day trad|swing|position trad|trading style/, "Scalping holds for seconds to minutes and needs tight spreads and discipline. Day trading closes by day's end. Swing trading holds days to weeks and suits people with jobs. Position trading holds weeks to months and follows macro trends. Pick the style that fits your schedule and temperament."],

  [/news|nfp|non.?farm|cpi|inflation|fomc|fed\b|ecb|boe|boj|fundamental/, "Big movers are central bank decisions like the Fed, ECB, BoE and BoJ, non-farm payrolls, CPI inflation, GDP and employment data. Spreads widen and price whipsaws around releases, so many traders stand aside or wait for the first reaction to settle."],
  [/session|london|new york|tokyo|asian|overlap|best time/, "The Asian session is quieter and often ranges, London brings the highest liquidity and real trends, and New York adds volatility, especially during the London overlap from about eight to noon Eastern. The overlap is usually the best time to trade."],
  [/major|pairs|eurusd|gbpusd|usdjpy|audusd|usdchf|usdcad|nzdusd|cross pair|exotic/, "The majors are EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD and NZDUSD, with the tightest spreads. Crosses like EURJPY skip the dollar, and exotics pair a major with an emerging currency and cost more to trade. GBP pairs are volatile, JPY pairs are often risk-sentiment driven."],

function ask(q){
  const s = q.toLowerCase();

async function nativeListen(){

      + 'Your reply is spoken aloud: one to three short sentences, plain text, no markdown, lists or emojis. Address the user as ' + who + '. Never assume the user\'s gender. '
      + 'In this mode you have NO live prices and cannot place trades; never invent prices or forecasts, and say so if asked; explain how to analyse instead. Mention only occasionally that this is education, not financial advice.\n'
      + (m.facts && m.facts.length ? 'Things you remember about the user: ' + m.facts.join('; ') + '\n' : '')
      + (turns ? 'Conversation so far:\n' + turns + '\n' : '') + 'User: ' + q + '\nYou:';
    const r = await sample(prompt, {modelTier: 'quick', cache: false});
    return (r && r.text ? r.text.trim() : '') || local;
  } catch(e){ return local; }
}
function demoMemory(q){
  const m = memLoad(); m.facts = m.facts || []; let s;
  if (/\b(who (built|made|created|programmed|designed|developed|invented|owns?) (you|this)|who is your (creator|maker|builder|developer|owner|boss|father)|who('s| is) your boss|who do you work for)\b/i.test(q)) return 'I was built by ' + CREATOR + ', my boss. When my AI answers are on, I run on Claude, made by Anthropic.';
  if (/\b(who am i|what(?:'s| is) my (?:full )?name|do you know (?:me|who i am)|do you remember my name)\b/i.test(q)) return m.name === OWNER ? 'You are ' + CREATOR + ', the person who built me, and I am glad to see you.' : 'You are ' + m.name + '.';
  if (/\b(repeat (that|it|what you said|yourself)|say (that|it) again|what did you (just )?say|come again|pardon|can you repeat|one more time)\b/i.test(q)){ metaTurn = true; return lastReply ? 'Of course. I said: ' + lastReply : 'I have not said anything yet.'; }
  if (/what (was|is) my (last|previous) (question|message)|what did i (just )?(say|ask)\s*\??\s*$/i.test(q)){ metaTurn = true; return lastQ ? 'You asked: ' + lastQ : 'You have not asked me anything yet.'; }
  if ((s = q.match(/^\s*(?:and|what about|how about)\s+(.+?)\s*\??\s*$/i))){ for (const [re, ans] of FOREX_KB) if (re.test(s[1].toLowerCase())) return ans + ' This is education, not financial advice.'; }
  if ((s = q.match(/\b(?:my name is|call me|i am called|i'm called)\s+([A-Za-z][A-Za-z'\-]*)/i))){ const w = s[1][0].toUpperCase() + s[1].slice(1).toLowerCase(); m.name = m.address = w; memSave(m); return 'Lovely to meet you, ' + w + '. I will remember that.'; }
  if ((s = q.match(/^\s*(?:please\s+)?remember(?:\s+that)?\s+(.+)$/i))){ m.facts.push(s[1]); memSave(m); return 'I will remember that: ' + s[1] + '.'; }
  if (/what do you (?:remember|know) about me|what do you remember/i.test(q)) return (m.name || m.facts.length) ? 'I remember' + (m.name ? ' that your name is ' + m.name + '.' : ':') + (m.facts.length ? ' ' + m.facts.join('; ') + '.' : '') : 'I do not remember anything about you yet.';
  if (/forget (everything|all)/i.test(q)){ memSave({}); return 'Done. In demo mode I have forgotten everything. Connect your server for permanent memory.'; }
  return null;
}
